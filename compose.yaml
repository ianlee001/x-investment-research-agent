services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: xresearch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: xresearch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xresearch -d xresearch"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    env_file: [.env, .env.docker]
    environment: &app_environment
      DATABASE_URL: postgresql://xresearch:${POSTGRES_PASSWORD}@db:5432/xresearch
      APP_AUTH_TOKEN: ${APP_AUTH_TOKEN:?Set APP_AUTH_TOKEN in .env.docker}
    command: ["xresearch", "init"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    env_file: [.env, .env.docker]
    environment: *app_environment
    ports: ["127.0.0.1:8765:8765"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
  worker:
    build: .
    env_file: [.env, .env.docker]
    environment: *app_environment
    command: ["xresearch", "worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  pgdata:
