[project]
name = "x-investment-research"
version = "1.0.0"
description = "Evidence-first investment research with X, SEC, Massive and Tavily"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy[asyncio]>=2.0.40,<3",
  "alembic>=1.15,<2",
  "psycopg[binary,pool]>=3.2.6,<4",
  "langchain[mcp]==1.4.3",
  "langchain-openai>=1.0,<2",
  "langgraph>=1.1.5,<2",
  "langgraph-checkpoint-postgres>=3,<4",
  "httpx>=0.28,<1",
  "beautifulsoup4>=4.13,<5",
  "apscheduler>=3.11,<4",
  "tzdata>=2025.1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "respx>=0.22,<1", "ruff>=0.11,<1"]

[project.scripts]
xresearch = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires the local PostgreSQL instance", "live: opt-in paid provider requests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
